name: Action reminders

# Pings the action-reminders edge function every hour. The function decides
# what is due and sends email only for actions inside the reminder window,
# so most runs are no-ops.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set — skipping."
            exit 0
          fi
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
            "$SUPABASE_URL/functions/v1/action-reminders" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            ${CRON_SECRET:+-H "x-cron-secret: $CRON_SECRET"} \
            -d '{}')
          echo "HTTP $code"; cat /tmp/out.json
          test "$code" -lt 400
